<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 物业账单管家</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; }
    .login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .login-logo { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
    .login-title { font-size: 20px; font-weight: 700; color: #0f172a; }
    .login-sub { color: #64748b; font-size: 13px; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #334155; }
    .login-form input { padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
    .login-form input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .login-btn { margin-top: 8px; padding: 13px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login-btn:hover { background: #1d4ed8; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-tip { margin-top: 18px; padding: 12px; background: #f8fafc; border-radius: 8px; font-size: 12px; color: #64748b; line-height: 1.6; }
    .login-error { color: #dc2626; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">¥</div>
      <div>
        <div class="login-title">物业账单管家</div>
        <div class="login-sub">租户 · 水电 · 账单</div>
      </div>
    </div>
    <form class="login-form" id="loginForm" onsubmit="return false;">
      <label>
        <span>用户名</span>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </label>
      <label>
        <span>密码</span>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </label>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="login-btn" id="loginBtn">登录</button>
    </form>
    <div class="login-tip">
      默认账号：<b>admin</b>，默认密码：<b>admin123</b><br>
      首次启动后建议立即修改默认密码。
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
